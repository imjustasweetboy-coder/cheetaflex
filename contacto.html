<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contacto | CheetaFlex™</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><g transform='skewX(-14)' font-family='Arial Black, sans-serif' font-weight='900' font-size='62'><text x='24' y='64' fill='%23ffffff'>E</text><text x='58' y='76' fill='%2322c55e'>E</text></g></svg>">

  <style>
    :root {
      --mar-fondo: #0f172a;       
      --mar-tarjeta: #1e293b;     
      --selva: #22c55e;           
      --cielo: #ffffff;           
      --cielo-tenue: #94a3b8;     
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--mar-fondo);
      color: var(--cielo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* BANNER SUPERIOR */
    .top-banner {
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      font-size: 1.2rem;
      font-weight: 900;
      font-style: italic;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      line-height: 1;
      gap: 1px;
    }

    .nav-brand .brand-cheeta { color: var(--cielo); transform: translateY(-1px); }
    .nav-brand .brand-flex { color: var(--selva); transform: translateY(1px); }
    .nav-brand .brand-tm {
      font-size: 0.45rem;
      font-weight: 700;
      font-style: normal;
      color: var(--cielo-tenue);
      opacity: 0.6;
      margin-left: 2px;
      align-self: flex-start;
    }

    .home-btn {
      background-color: var(--mar-tarjeta);
      border: 1px solid var(--border);
      color: var(--cielo);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .home-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .home-btn:hover {
      background-color: var(--selva);
      border-color: var(--selva);
      color: var(--mar-fondo);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.35);
    }

    .home-btn:hover svg {
      transform: scale(1.1);
    }

    /* CONTENEDOR PRINCIPAL DE CONTACTO */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .contact-card {
      background-color: var(--mar-tarjeta);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .emoji-3d-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35));
      margin-bottom: 4px;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* TÍTULO ESCALONADO BLANCO / VERDE */
    .contact-title {
      font-size: clamp(1.8rem, 5vw, 2.3rem);
      font-weight: 900;
      font-style: italic;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      gap: 4px;
      letter-spacing: -0.5px;
    }

    .contact-title .title-white { color: var(--cielo); transform: translateY(-3px); }
    .contact-title .title-green { color: var(--selva); transform: translateY(3px); }

    .contact-desc {
      color: var(--cielo-tenue);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* BOTÓN / CAJA DE CORREO */
    .email-box {
      margin-top: 10px;
      background-color: var(--mar-fondo);
      border: 1px solid var(--selva);
      color: var(--selva);
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      word-break: break-all;
    }

    .email-box svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .email-box:hover {
      background-color: var(--selva);
      color: var(--mar-fondo);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- BANNER SUPERIOR -->
  <header class="top-banner">
    <a href="/" class="nav-brand">
      <span class="brand-cheeta">CHEETA</span><span class="brand-flex">FLEX</span>
    </a>

    <a href="/" class="home-btn" aria-label="Volver al inicio">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </a>
  </header>

  <!-- CONTENIDO CENTRAL -->
  <main class="main-content">
    <div class="contact-card">
      <img 
        src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Envelope/3D/envelope_3d.png" 
        alt="Sobre 3D" 
        class="emoji-3d-img" 
        loading="lazy"
        onerror="this.onerror=null; this.src='https://em-content.zobj.net/source/microsoft-3d-fluent/3591/envelope_2709-fe0f.png';"
      >
      
      <h1 class="contact-title">
        <span class="title-white">CONTACTO</span><span class="title-green">DIRECTO</span>
      </h1>
      
      <p class="contact-desc">
        ¿Tienes dudas, sugerencias o te interesa colaborar con nosotros? Puedes escribirnos directamente a nuestro correo electrónico:
      </p>

      <a href="mailto:contacto@cheetaflex.com" class="email-box">
        <svg viewBox="0 0 24 24">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        contacto@cheetaflex.com
      </a>
    </div>
  </main>

</body>
</html>
